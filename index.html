
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #fff8df;
  color: #493d30;
  text-align: center;
  padding: 28px 16px;
}
.container {
  max-width: 760px;
  margin: auto;
}
h1 { color: #e69b28; font-size: 32px; }
.subtitle { color: #85745e; margin-bottom: 25px; }
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
button {
  cursor: pointer;
  border: 2px solid #f2d48c;
  border-radius: 14px;
  background: #fff;
  padding: 13px 5px;
  color: #594a36;
  font-size: 16px;
  font-weight: bold;
  transition: .2s;
}
button:hover {
  background: #ffe8a6;
  transform: translateY(-2px);
}
#result {
  display: none;
  margin-top: 28px;
  padding: 24px 18px;
  background: white;
  border: 2px solid #f2d48c;
  border-radius: 22px;
}
#pokemonImage {
  width: 180px;
  height: 180px;
  object-fit: contain;
  image-rendering: pixelated;
}
#pokemonName { color: #e69b28; font-size: 27px; }
.info {
  background: #fff8df;
  border-radius: 12px;
  padding: 13px;
  margin: 12px 0;
  line-height: 1.7;
}
#reset {
  margin-top: 18px;
  background: #f6c95b;
  border: none;
  padding: 12px 24px;
}
#imageStatus { color: #a18d73; font-size: 12px; }
@media (max-width: 480px) {
  .buttons { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button { font-size: 14px; padding: 12px 2px; }
  h1 { font-size: 26px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ MBTI 포켓몬 찾기 ⚡</h1>
  <p class="subtitle">나와 가장 잘 어울리는 포켓몬은 누구일까?</p>

  <div class="buttons" id="mbtiButtons"></div>

  <section id="result">
    <h2 id="resultType"></h2>
    <img id="pokemonImage" alt="포켓몬 이미지">
    <div id="pokemonName"></div>
    <div class="info" id="reason"></div>
    <div class="info" id="compatible"></div>
    <p id="imageStatus"></p>
  </section>

  <button id="reset" onclick="resetPage()">↻ 다시 선택하기</button>
</div>

<script>
const pokemonData = {
  ISTJ:{id:143,name:"잠만보",emoji:"😴",reason:"차분하고 책임감이 강하며 맡은 일을 꾸준히 해내는 유형!",compatible:"잘 맞는 MBTI: ESFP"},
  ISFJ:{id:242,name:"해피너스",emoji:"💗",reason:"주변 사람을 잘 챙기고 따뜻한 마음을 가진 유형!",compatible:"잘 맞는 MBTI: ESTP"},
  INFJ:{id:151,name:"뮤",emoji:"✨",reason:"상상력이 풍부하고 자신만의 깊은 생각을 가진 유형!",compatible:"잘 맞는 MBTI: ENFP"},
  INTJ:{id:150,name:"뮤츠",emoji:"🧠",reason:"전략적이고 분석적이며 목표를 향해 나아가는 유형!",compatible:"잘 맞는 MBTI: ENFP"},
  ISTP:{id:359,name:"앱솔",emoji:"🌙",reason:"독립적이고 문제를 해결하는 능력이 뛰어난 유형!",compatible:"잘 맞는 MBTI: ESFJ"},
  ISFP:{id:133,name:"이브이",emoji:"🦊",reason:"자유롭고 다정하며 자신만의 감성을 가진 유형!",compatible:"잘 맞는 MBTI: ESTJ"},
  INFP:{id:492,name:"쉐이미",emoji:"🌸",reason:"순수하고 상상력이 풍부하며 자신의 가치관을 소중히 여기는 유형!",compatible:"잘 맞는 MBTI: ENFJ"},
  INTP:{id:150,name:"뮤츠",emoji:"🔬",reason:"호기심이 많고 논리적으로 원리를 탐구하는 유형!",compatible:"잘 맞는 MBTI: ENTJ"},
  ESTP:{id:25,name:"피카츄",emoji:"⚡",reason:"활동적이고 순발력이 뛰어나며 도전을 즐기는 유형!",compatible:"잘 맞는 MBTI: ISFJ"},
  ESFP:{id:128,name:"켄타로스",emoji:"🐂",reason:"에너지가 넘치고 사람들과 함께하는 것을 좋아하는 유형!",compatible:"잘 맞는 MBTI: ISTJ"},
  ENFP:{id:155,name:"브케인",emoji:"🔥",reason:"열정적이고 새로운 가능성을 찾아다니는 유형!",compatible:"잘 맞는 MBTI: INFJ"},
  ENTP:{id:149,name:"망나뇽",emoji:"🐉",reason:"재치 있고 아이디어가 많으며 새로운 시도를 즐기는 유형!",compatible:"잘 맞는 MBTI: INTJ"},
  ESTJ:{id:68,name:"괴력몬",emoji:"💪",reason:"실행력이 강하고 목표를 체계적으로 이루어 가는 유형!",compatible:"잘 맞는 MBTI: ISFP"},
  ESFJ:{id:131,name:"라프라스",emoji:"🌊",reason:"친절하고 협동심이 강하며 주변과 조화를 이루는 유형!",compatible:"잘 맞는 MBTI: ISTP"},
  ENFJ:{id:448,name:"루카리오",emoji:"🥋",reason:"리더십이 있고 다른 사람을 응원하며 이끄는 유형!",compatible:"잘 맞는 MBTI: INFP"},
  ENTJ:{id:6,name:"리자몽",emoji:"🐲",reason:"자신감이 있고 큰 목표를 향해 적극적으로 도전하는 유형!",compatible:"잘 맞는 MBTI: INTP"}
};

const types = Object.keys(pokemonData);
const buttonArea = document.getElementById("mbtiButtons");

types.forEach(type => {
  const button = document.createElement("button");
  button.textContent = type;
  button.onclick = () => showResult(type);
  buttonArea.appendChild(button);
});

function showResult(type) {
  const p = pokemonData[type];
  document.getElementById("result").style.display = "block";
  document.getElementById("resultType").textContent = type + " 유형의 포켓몬";
  document.getElementById("pokemonName").textContent = p.name;
  document.getElementById("reason").textContent = p.reason;
  document.getElementById("compatible").textContent = p.compatible;

  loadPokemonImage(p);
  document.getElementById("result").scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });
}

function loadPokemonImage(p) {
  const img = document.getElementById("pokemonImage");
  const status = document.getElementById("imageStatus");

  const urls = [
    `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`,
    `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png`,
    `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${p.id}.gif`,
    `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${p.id}.gif`
  ];

  let index = 0;
  status.textContent = "포켓몬 이미지를 불러오는 중...";
  img.onerror = function() {
    index++;
    if (index < urls.length) {
      img.src = urls[index];
    } else {
      img.onerror = null;
      img.alt = p.name + " 이미지 로딩 실패";
      img.src = "";
      status.textContent = "이미지를 불러오지 못했어요. 인터넷 연결을 확인해 주세요. " + p.emoji;
    }
  };
  img.onload = function() {
    status.textContent = "";
  };
  img.src = urls[index];
}

function resetPage() {
  document.getElementById("result").style.display = "none";
  window.scrollTo({top: 0, behavior: "smooth"});
}
</script>
</body>
</html>
